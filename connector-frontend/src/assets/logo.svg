<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Left C Node Gradient -->
    <linearGradient id="nodeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Right C Node Gradient -->
    <linearGradient id="nodeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>

    <!-- Glowing Bridge Accent -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- LOGO MARK: Interlocking Nodes & Connector Loop -->
  <g transform="translate(180, 150)">
    <!-- Left Loop Segment -->
    <path d="M 60,30 C 10,30 10,120 60,120 L 95,120" 
          fill="none" 
          stroke="url(#nodeLeft)" 
          stroke-width="18" 
          stroke-linecap="round"/>

    <!-- Right Loop Segment -->
    <path d="M 90,30 C 140,30 140,120 90,120 L 55,120" 
          fill="none" 
          stroke="url(#nodeRight)" 
          stroke-width="18" 
          stroke-linecap="round"/>

    <!-- Center Bridge Connection Pin -->
    <path d="M 50,75 L 100,75" 
          fill="none" 
          stroke="url(#bridgeGrad)" 
          stroke-width="14" 
          stroke-linecap="round"/>

    <!-- Left Connection Node -->
    <circle cx="50" cy="75" r="14" fill="#FFFFFF"/>
    <circle cx="50" cy="75" r="7" fill="#2563EB"/>

    <!-- Right Connection Node -->
    <circle cx="100" cy="75" r="14" fill="#FFFFFF"/>
    <circle cx="100" cy="75" r="7" fill="#14B8A6"/>
  </g>

  <!-- TYPOGRAPHY: CONNECTOR -->
  <g transform="translate(350, 240)">
    <text font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-size="62" 
          font-weight="800" 
          letter-spacing="1.5">
      <tspan fill="#0F172A">CONNECT</tspan><tspan fill="#2563EB">OR</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="4" 
          y="32" 
          font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-size="14" 
          font-weight="600" 
          letter-spacing="9" 
          fill="#64748B">SYSTEM INTEGRATION</text>
  </g>
</svg>
